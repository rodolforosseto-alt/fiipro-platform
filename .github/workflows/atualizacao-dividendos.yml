name: Atualizacao de dividendos FIIPro

on:
  workflow_dispatch:

  schedule:
    - cron: "2,17,32,47 * * * *"
      timezone: "America/Sao_Paulo"
      
permissions:
  contents: read

concurrency:
  group: fiipro-atualizacao-dividendos
  cancel-in-progress: false

jobs:
  atualizar-dividendos:
    name: Consultar Fundamentus e atualizar Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar configuracao dos Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Executar importacao automatica
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python dividendos/fundamentus_supabase.py
